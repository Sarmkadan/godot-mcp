name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No global.json in the repo; all projects target net10.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore GodotMcp.slnx
      - run: dotnet build GodotMcp.slnx --no-restore -c Release
      - run: dotnet test GodotMcp.slnx --no-build -c Release --logger trx --results-directory TestResults
      - name: Pack
        run: dotnet pack src/GodotMcp.Server -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
